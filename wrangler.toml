# Cloudflare Workers configuration for M&M Real Estate
# NOTE: the Worker service name below is unchanged on purpose — renaming it
# would move the deployment to a new *.workers.dev URL / require a domain
# migration. Ask before changing `name` or the D1/R2 resource names.
name = "sa-inmobiliaria"
main = "./.output/server/index.mjs"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./.output/public"
binding = "ASSETS"

# --- Deploy pipeline ---
# Cloudflare Workers Builds (Settings → Build → Deploy command) currently
# just runs `npx wrangler deploy`, which deploys code WITHOUT applying any
# pending D1 migration — this is exactly what caused the July schema-drift
# incident (new code, old schema, every public/admin endpoint 500ing).
# To close that gap, set the dashboard's Deploy command to:
#   npm run release
# (and the non-production branch deploy command, once enabled per the note
# below, to `npm run release:staging`). Both run migrations, then build,
# then deploy, in that order, so the new code never goes live before its
# own schema does.

# --- D1 database (relational data, replaces MySQL) ---
# Create it with:  wrangler d1 create sa_inmobiliaria
# then paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "sa_inmobiliaria"
database_id = "e30a586f-b692-4edb-b34e-cdc8be9eb24d"
migrations_dir = "migrations"

# --- R2 bucket (file/image storage, replaces local disk) ---
# Create it with:  wrangler r2 bucket create sa-inmobiliaria-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sa-inmobiliaria-media"

[vars]
# Session cookie signing/config
SESSION_TTL_DAYS = "7"

[observability]
enabled = true

# "0 * * * *"  -> server/tasks/cms/expire-articles.ts (hourly, auto-hides
#                 published articles whose expires_at has passed) and
#                 server/tasks/system/cleanup-error-logs.ts (purges error_logs
#                 older than 30 days)
# "* * * *  *" -> server/tasks/scheduler/dispatch.ts (Publication Scheduler
#                 dispatcher — every minute, so staged-launch offsets land on time)
#                 and server/tasks/appointments/reminders.ts (24h/1h
#                 appointment reminders, same per-minute tick)
# "30 3 * * *" -> server/tasks/system/backup-d1.ts (daily JSON snapshot of
#                 every D1 table to R2, kept 14 days — see that file for why)
# "0 5 * * *"  -> server/tasks/system/media-lifecycle.ts (daily, purges media
#                 past its 30-day soft-delete grace period and reconciles
#                 per-tenant storage usage — see that file for why)
# "0 4 * * 1"  -> server/tasks/scheduler/recompute-ai-time.ts (weekly, refreshes
#                 the "hora recomendada por IA" hint from real execution history)
[triggers]
crons = ["0 * * * *", "* * * * *", "30 3 * * *", "0 5 * * *", "0 4 * * 1"]

# --- Staging environment ---
# Own D1 + R2 so a build deployed here can never touch production data.
# Deploy with:      npm run deploy:staging   (wrangler deploy --env staging)
# Preview locally:  npx wrangler dev --env staging
#
# To actually get preview URLs for non-production branches instead of every
# push going straight to production, this also needs a one-time change in
# the Cloudflare dashboard (not something Wrangler config can do on its own):
#   Workers & Pages → sa-inmobiliaria → Settings → Build → Branch control
#   1. Set "Production branch" to `main` (today it is effectively whichever
#      branch is being pushed — that's the root cause of the schema-drift
#      incident from July: every push, on any branch, deployed straight to
#      production).
#   2. Enable "Builds for non-production branches".
#   3. Set the "Non-production branch deploy command" to:
#        npx wrangler versions upload --env staging
[env.staging]
name = "sa-inmobiliaria-staging"

[env.staging.assets]
directory = "./.output/public"
binding = "ASSETS"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "sa_inmobiliaria_staging"
database_id = "baeebb44-e835-4cec-9568-2ce99d1b6d30"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "sa-inmobiliaria-media-staging"

[env.staging.vars]
SESSION_TTL_DAYS = "7"

[env.staging.observability]
enabled = true

[env.staging.triggers]
crons = ["0 * * * *", "* * * * *", "30 3 * * *", "0 5 * * *", "0 4 * * 1"]
