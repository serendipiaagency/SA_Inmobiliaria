# Cloudflare Workers configuration for M&M Real Estate
# NOTE: the Worker service name below is unchanged on purpose — renaming it
# would move the deployment to a new *.workers.dev URL / require a domain
# migration. Ask before changing `name` or the D1/R2 resource names.
name = "sa-inmobiliaria"
main = "./.output/server/index.mjs"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./.output/public"
binding = "ASSETS"

# --- Deploy pipeline ---
# Deploys now go through .github/workflows/ci.yml ("CI & Deploy"), not
# Cloudflare Workers Builds — see docs/deployment.md for the full pipeline,
# the required manual setup (GitHub environments/secrets, and disabling
# Cloudflare's own git auto-deploy so the two systems don't race each
# other), and the rollback runbook. The July schema-drift incident (new code
# deployed via Cloudflare's auto-deploy without applying pending D1
# migrations first) is what this replaces.

# --- D1 database (relational data, replaces MySQL) ---
# Create it with:  wrangler d1 create sa_inmobiliaria
# then paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "sa_inmobiliaria"
database_id = "e30a586f-b692-4edb-b34e-cdc8be9eb24d"
migrations_dir = "migrations"

# --- R2 bucket (file/image storage, replaces local disk) ---
# Create it with:  wrangler r2 bucket create sa-inmobiliaria-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sa-inmobiliaria-media"

[vars]
# Session cookie signing/config
SESSION_TTL_DAYS = "7"
# Optional: the platform's own primary/marketing domain, if it has one
# distinct from the *.workers.dev URL. Requests to this host (and to
# *.workers.dev and localhost, always) serve the default tenant
# (organization 1) — see server/utils/domain.ts and
# server/middleware/00.tenant.ts. Leave unset if there is no such domain;
# every OTHER tenant's own domain is set per-organization in
# /admin/organizations, not here.
# PRIMARY_DOMAIN = "sa-inmobiliaria.example"
#
# Emails propios de Portal INMO (docs/email.md): alta y estado de empresas,
# cuenta de usuario, avisos de la web y avisos internos al equipo. Sin definir,
# el código usa Portal INMO <info@serendipiaagency.com>, responde-a y contacto
# («¿Hablamos?», PLATFORM_EMAIL_CONTACT) la misma dirección; los avisos al super admin van a las
# cuentas super_admin. Necesita el secreto RESEND_API_KEY y el dominio
# serendipiaagency.com verificado en esa cuenta de Resend.
# PLATFORM_EMAIL_FROM_NAME = "Portal INMO"
# PLATFORM_EMAIL_FROM_ADDRESS = "info@serendipiaagency.com"
# PLATFORM_EMAIL_REPLY_TO = "info@serendipiaagency.com"
# PLATFORM_EMAIL_CONTACT = "info@serendipiaagency.com"
# PLATFORM_ADMIN_NOTIFY_EMAILS = "info@serendipiaagency.com"
# PLATFORM_BASE_URL = "https://sa-inmobiliaria.example"
#
# Email ENTRANTE (FASE 29, docs/communications.md «Email entrante»): el dominio
# o subdominio con Cloudflare Email Routing cuya regla respuestas@<dominio>
# envía al Worker. Con él y el secreto INBOUND_EMAIL_SECRET
# (`wrangler secret put INBOUND_EMAIL_SECRET`, >= 32 caracteres aleatorios),
# el email de un hilo web sale con un Reply-To firmado de ese hilo y la
# respuesta del cliente vuelve a él. Sin los dos, nada cambia.
# INBOUND_EMAIL_DOMAIN = "respuestas.serendipiaagency.com"
#
# Mapas (docs/maps.md «Proveedor»): clave de CARTO Basemaps. Sin ella, CARTO
# sirve una tesela «API KEY REQUIRED» en vez del mapa, y los mapas usan
# OpenStreetMap. Se pide gratis en https://carto.com/basemaps/apikey (uso
# comercial gratuito hasta 1M de teselas al mes). Es una clave pública: llega
# al navegador en cada URL de tesela. Mejor como secreto
# (`wrangler secret put CARTO_BASEMAPS_KEY`), que sobrevive a los despliegues.
# CARTO_BASEMAPS_KEY = "..."
#
# Cuenta demo comercial «Norte Astur Inmobiliaria» (docs/demo.md): con "1", la
# tarea de cada minuto demo:provision la crea sola la primera vez que no
# existe (empresa aislada, marcada como demo, sin envíos reales). Nunca la
# borra ni la restablece por su cuenta: eso se pide en Sistemas > Empresas.
DEMO_TENANT_AUTOPROVISION = "1"

[observability]
enabled = true

# --- Browser Rendering (formatos de imagen para redes del Asset Export) ---
# server/utils/assetExport/socialRenderer.ts rasteriza las piezas 1080×1080,
# 1080×1350 y 1080×1920 con un Chromium sin cabeza de Cloudflare. Mientras
# este binding esté comentado, esos formatos responden 422 diciendo que falta
# (Estado del sistema también lo dice); los PDF no dependen de esto. Está
# comentado porque no se puede probar en `wrangler dev` ni en CI: quien tenga
# acceso a la cuenta lo activa (Browser Rendering viene con Workers Paid),
# despliega y genera una pieza de prueba — ver docs/asset-export-studio.md.
# [browser]
# binding = "BROWSER"

# "0 * * * *"  -> server/tasks/cms/expire-articles.ts (hourly, auto-hides
#                 published articles whose expires_at has passed),
#                 server/tasks/system/cleanup-error-logs.ts (purges error_logs
#                 older than 30 days), server/tasks/marketing/saved-search-alerts.ts
#                 (emails saved-search subscribers about new matches),
#                 server/tasks/payments/reconcile-deposits.ts (polls Stripe for
#                 any deposit the webhook never confirmed) and
#                 server/tasks/notifications/retry-email-queue.ts (retries
#                 any transactional email that failed to send) and
#                 server/tasks/notifications/retry-webhook-queue.ts (retries
#                 any outbound webhook delivery that failed)
# "* * * *  *" -> server/tasks/scheduler/dispatch.ts (Publication Scheduler
#                 dispatcher — every minute, so staged-launch offsets land on time),
#                 server/tasks/appointments/reminders.ts (24h/1h
#                 appointment reminders, same per-minute tick) and
#                 server/tasks/system/check-custom-domains.ts (every 10th
#                 minute: verifies each custom domain still routes to its
#                 organization, alerts on state changes — see that file) and
#                 server/tasks/automations/run.ts (automatizaciones activas de
#                 cada agencia sobre sus eventos nuevos — bloque N8b)
#                 and server/tasks/demo/provision.ts (genera la cuenta demo por
#                 tramos mientras haya una generación en curso — docs/demo.md)
# "30 3 * * *" -> server/tasks/system/backup-d1.ts (daily JSON snapshot of
#                 every D1 table to R2, kept 14 days — see that file for why)
# "0 5 * * *"  -> server/tasks/system/media-lifecycle.ts (daily, purges media
#                 past its 30-day soft-delete grace period and reconciles
#                 per-tenant storage usage — see that file for why)
# "0 4 * * 1"  -> server/tasks/scheduler/recompute-ai-time.ts (weekly, refreshes
#                 the "hora recomendada por IA" hint from real execution history)
[triggers]
crons = ["0 * * * *", "* * * * *", "30 3 * * *", "0 5 * * *", "0 4 * * 1"]

# --- Staging environment ---
# Own D1 + R2 so a build deployed here can never touch production data.
# Deployed automatically by the `deploy-staging` job in
# .github/workflows/ci.yml on every pull request (migrations, then deploy,
# then smoke tests — see docs/deployment.md). `npm run deploy:staging` /
# `npm run release:staging` remain for manual/local use.
# Preview locally:  npx wrangler dev --env staging
[env.staging]
name = "sa-inmobiliaria-staging"

[env.staging.assets]
directory = "./.output/public"
binding = "ASSETS"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "sa_inmobiliaria_staging"
database_id = "baeebb44-e835-4cec-9568-2ce99d1b6d30"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "sa-inmobiliaria-media-staging"

[env.staging.vars]
SESSION_TTL_DAYS = "7"
DEMO_TENANT_AUTOPROVISION = "1"
# Email entrante en staging: OTRO dominio/subdominio y otro INBOUND_EMAIL_SECRET
# (`wrangler secret put INBOUND_EMAIL_SECRET --env staging`).
# INBOUND_EMAIL_DOMAIN = "respuestas-staging.serendipiaagency.com"

[env.staging.observability]
enabled = true

# Igual que en producción: actívalo aquí primero para probar los formatos de
# imagen sin tocar producción.
# [env.staging.browser]
# binding = "BROWSER"

[env.staging.triggers]
crons = ["0 * * * *", "* * * * *", "30 3 * * *", "0 5 * * *", "0 4 * * 1"]
