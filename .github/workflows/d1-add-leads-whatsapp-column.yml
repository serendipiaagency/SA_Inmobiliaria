name: D1 — añadir leads.whatsapp en producción (paso único, fuera de la secuencia numerada)

# Caso excepcional, ligado a un incidente concreto (ver
# migrations/0070_developer_property_matches_and_lead_stage_backfill.sql y
# .github/workflows/d1-mark-migration-applied.yml para el contexto
# completo): `leads.whatsapp` la crea 0069 en cualquier base de datos nueva,
# pero en producción 0069 se marcó como aplicada sin ejecutar su SQL (su
# esquema ya existía por otro camino, salvo esta columna). Repetir el ALTER
# en un fichero de migración numerado rompería local/CI/staging con
# "columna duplicada". Este workflow hace ese único ALTER, sólo contra
# producción, sólo una vez.
#
# Puede borrarse en cuanto se haya ejecutado con éxito — no es
# infraestructura reutilizable, es la resolución de este incidente concreto.
# Disparo manual, con confirmación explícita.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe CONFIRMO para añadir la columna whatsapp (TEXT, nullable) a leads en producción'
        required: true
        type: string

jobs:
  add-column:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Comprobar la confirmación
        run: |
          if [ "${{ inputs.confirmar }}" != "CONFIRMO" ]; then
            echo "::error::Confirmación ausente o incorrecta. No se ha tocado nada."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Comprobar que la columna no existe ya (evita el mismo error que motivó esto)
        run: npx wrangler d1 execute sa_inmobiliaria --remote --command "SELECT COUNT(*) AS ya_existe FROM pragma_table_info('leads') WHERE name = 'whatsapp';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Copia de seguridad de D1 antes de escribir
        run: npx wrangler d1 export sa_inmobiliaria --remote --output=pre-alter-backup.sql --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Guardar la copia como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pre-alter-backup-${{ github.run_id }}
          path: pre-alter-backup.sql
          retention-days: 30

      - name: Añadir la columna
        run: npx wrangler d1 execute sa_inmobiliaria --remote --command "ALTER TABLE leads ADD COLUMN whatsapp TEXT;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Confirmar el resultado
        run: npx wrangler d1 execute sa_inmobiliaria --remote --command "SELECT COUNT(*) AS ya_existe FROM pragma_table_info('leads') WHERE name = 'whatsapp';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
