name: Restaurar una copia de seguridad de D1 en producción

# ESCRIBE EN PRODUCCIÓN Y SOBREESCRIBE DATOS. Sólo se dispara a mano y sólo
# con el visto bueno explícito del propietario, cada vez.
#
# Es el camino inverso, probado, de las dos copias de seguridad que ya
# existían (docs/deployment.md → "Backups y restauración de D1"):
#
#   - `instantanea-diaria`: el JSON comprimido que server/tasks/system/backup-d1.ts
#     deja cada noche en R2 (`backups/AAAA-MM-DD.json.gz`). Restaura tabla a
#     tabla (DELETE + INSERT) sin tocar el esquema ni el ledger de
#     migraciones; por defecto omite sessions, rate_limits y
#     password_reset_tokens (efímeras y sensibles).
#   - `volcado-sql`: el `.sql` de `wrangler d1 export` que guarda cada
#     despliegue y cada aplicación manual de migraciones. Vacía el esquema
#     entero (hijas antes que padres, según las claves foráneas reales) y
#     ejecuta el volcado: la base queda EXACTAMENTE como al exportar, ledger
#     de migraciones incluido. Si después hay migraciones nuevas, el último
#     paso las aplica.
#
#     Ese `.sql` vive en R2 (`backups/pre-…/<sha|run_id>.sql`), no como
#     artefacto de Actions. Lo era hasta que se descubrió que los artefactos
#     de un repositorio público se descargan sin autenticación, es decir que
#     subirlo publicaba la base de datos entera. Por eso aquí se baja con
#     `wrangler r2 object get` y no con `gh run download`, que sólo ve
#     artefactos y por tanto no encontraría ninguna copia nueva.
#
# Antes de restaurar nada se exporta el estado actual y se sube a R2: es el
# punto de retorno si la restauración era un error.
#
# El script hace la verificación de verdad (cuenta filas contra la copia) y
# falla el job si no cuadra. `scripts/restore-d1-backup.mjs` explica el
# resto y test/unit/backup.restore.test.ts lo ejecuta contra una base real.
on:
  workflow_dispatch:
    inputs:
      origen:
        description: 'Qué copia restaurar'
        required: true
        default: instantanea-diaria
        type: choice
        options:
          - instantanea-diaria
          - volcado-sql
      referencia:
        description: 'Clave del objeto en R2, en los dos casos. instantanea-diaria: p. ej. backups/2026-09-18.json.gz. volcado-sql: p. ej. backups/pre-deploy/<sha>.sql (o pre-migration/, pre-restore/, pre-seed/, pre-alter/ con el id del run).'
        required: true
        type: string
      tablas:
        description: 'Sólo para instantanea-diaria, opcional: lista separada por comas para restaurar únicamente esas tablas (vacío = todas las no efímeras).'
        required: false
        type: string
      confirmar:
        description: 'Escribe RESTAURAR para confirmar que se van a SOBREESCRIBIR datos de producción'
        required: true
        type: string

jobs:
  restore:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      # Las entradas viajan por el entorno, nunca interpoladas en el script:
      # ${{ }} se sustituye antes de que bash lea la línea, así que un valor
      # con comillas y `;` se ejecutaría como orden del shell en un job que
      # lleva dentro el CLOUDFLARE_API_TOKEN de producción. Es además lo que
      # hace que las comprobaciones de abajo sirvan: un valor capaz de romper
      # el script puede saltárselas.
      # Quién puede disparar esto. No basta con que el workflow sea manual:
      # cualquiera con acceso de escritura al repositorio puede lanzarlo, y
      # estos jobs llevan dentro los secretos de producción. Si alguien deja
      # el proyecto y su acceso a GitHub tarda en revocarse, esta línea es lo
      # que separa «ya no trabaja aquí» de «sigue entrando en producción».
      #
      # Para autorizar a alguien más, añádelo a la lista separada por comas.
      - name: Comprobar quién dispara
        env:
          AUTORIZADOS: 'serendipiaagency'
          ACTOR: ${{ github.actor }}
        run: |
          case ",$AUTORIZADOS," in
            *",$ACTOR,"*) echo "Disparado por $ACTOR (autorizado)." ;;
            *)
              echo "::error::$ACTOR no está autorizado a disparar este workflow. No se ha tocado nada."
              exit 1
              ;;
          esac

      - name: Comprobar la confirmación
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          if [ "$CONFIRMAR" != "RESTAURAR" ]; then
            echo "::error::Confirmación ausente o incorrecta. No se ha tocado nada."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Punto de retorno — exportar el estado ACTUAL antes de restaurar
        run: npx wrangler d1 export sa_inmobiliaria --remote --output=pre-restore-backup.sql --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # NUNCA como artefacto: este repositorio es público y sus artefactos se
      # descargan sin autenticación, así que subir el volcado era publicar la
      # base de datos de producción entera. Va al bucket de R2, que es privado.
      - name: Guardar la copia en R2 (privado)
        run: |
          npx wrangler r2 object put \
            "sa-inmobiliaria-media/backups/pre-restore/${{ github.run_id }}.sql" \
            --file=pre-restore-backup.sql --content-type="application/sql" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: No dejar el volcado en el runner
        if: always()
        run: rm -f pre-restore-backup.sql

      - name: Restaurar la instantánea diaria desde R2
        if: inputs.origen == 'instantanea-diaria'
        # Sólo se llega aquí si el punto de retorno se subió.
        run: |
          extra=""
          if [ -n "$TABLAS" ]; then extra="--tables $TABLAS"; fi
          node scripts/restore-d1-backup.mjs --from-r2 "$REFERENCIA" --remote --confirm RESTAURAR $extra
        env:
          TABLAS: ${{ inputs.tablas }}
          REFERENCIA: ${{ inputs.referencia }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Descargar el volcado SQL desde R2
        if: inputs.origen == 'volcado-sql'
        # De R2 y no con `gh run download`: ese sólo ve artefactos de Actions,
        # y las copias ya no se suben ahí (publicaban la base de datos en un
        # repositorio público). Una copia hecha desde ese cambio es
        # inalcanzable para `gh run download`, así que esta rama no podía
        # restaurar nada.
        run: |
          npx wrangler r2 object get "sa-inmobiliaria-media/$REFERENCIA" \
            --file=volcado-a-restaurar.sql --remote
          if [ ! -s volcado-a-restaurar.sql ]; then
            echo "::error::No se ha descargado nada de sa-inmobiliaria-media/$REFERENCIA. Revisa la clave exacta (se lista con: npx wrangler r2 object get --help / el panel de R2)."
            exit 1
          fi
          echo "Volcado: $REFERENCIA ($(wc -c < volcado-a-restaurar.sql) bytes)"
        env:
          REFERENCIA: ${{ inputs.referencia }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Restaurar el volcado SQL
        if: inputs.origen == 'volcado-sql'
        run: node scripts/restore-d1-backup.mjs --sql volcado-a-restaurar.sql --remote --confirm RESTAURAR
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Aplicar las migraciones posteriores al volcado (si las hay)
        if: inputs.origen == 'volcado-sql'
        # El volcado deja el ledger tal y como estaba al exportar; el código
        # desplegado puede necesitar migraciones más recientes que ésas.
        run: |
          npx wrangler d1 migrations list sa_inmobiliaria --remote --env=""
          npx wrangler d1 migrations apply sa_inmobiliaria --remote --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comprobar que el panel sigue siendo utilizable
        run: node scripts/diagnose-access.mjs "admin@sa-inmobiliaria.com"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
