name: CI & Deploy

# Single pipeline for both validation and deployment — kept as one workflow
# (not a separate deploy.yml) so a PR's build/test/typecheck never runs
# twice. `validate` always runs; `deploy-staging` only for pull_request
# events labelled `staging` (never production data/credentials);
# `deploy-production` only for a push to `main`.
# No step in this file uses continue-on-error: a failure anywhere stops the
# pipeline before anything downstream (migrations, deploy, smoke tests)
# runs — see docs/deployment.md for the full rollback/runbook this
# pipeline is designed around.
#
# Pipeline shape:
#   validate -> deploy-{staging,production}:
#     preflight -> build -> backup -> migrations -> deploy -> smoke test
# The preflight steps (first in each deploy job) catch a missing/malformed
# GitHub Environment secret or variable with a clear message before any
# write against Cloudflare runs — see docs/production-hardening-audit.md
# (P1-11). They used to be separate jobs; merged to save Actions minutes.
#
# Ahorro de minutos (2026-10): docs-only changes skip the gate and deploys;
# e2e runs only on PRs; staging deploys only with the `staging` label;
# PR runs cancel superseded ones (never on main).
on:
  pull_request:
  push:
    branches: [main]

# Cancelar la ejecución anterior sólo en PRs (cada push nuevo deja obsoleta la
# anterior y así no se pagan minutos por ella). En `main` NUNCA se cancela: un
# segundo merge rápido interrumpiría el despliegue anterior a mitad de las
# migraciones remotas.
concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Ahorro de minutos: si el cambio sólo toca documentación (docs/, *.md),
      # no hace falta instalar, compilar ni probar nada. El job sigue
      # terminando en verde (los pasos saltados cuentan como éxito), así que
      # un check obligatorio en la protección de rama no se queda colgado.
      # Ante cualquier duda (base desconocida, primer push…) se valida todo.
      - name: Detect code changes (docs-only changes skip the gate)
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="HEAD^1"   # merge commit de la PR: su primer padre es la base
          else
            base="${{ github.event.before }}"
            git fetch --quiet --depth=1 origin "$base" 2>/dev/null || base=""
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Base no disponible: se valida todo."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "$changed"
          if echo "$changed" | grep -qvE '^(docs/.*|[^/]*\.md|public/demo-assets/.*\.md)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Sólo cambia documentación: se salta el gate y el despliegue."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install (clean)
        if: steps.changes.outputs.code == 'true'
        run: npm ci

      - name: Dependency audit (production dependencies)
        if: steps.changes.outputs.code == 'true'
        run: npm audit --omit=dev

      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.changes.outputs.code == 'true'
        run: npm test

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: npm run build

      - name: Validate migrations (sequence + clean apply on a fresh local D1)
        if: steps.changes.outputs.code == 'true'
        run: npm run migrations:check

      - name: Install Playwright browsers
        # El e2e (lo más caro del gate: navegadores + otro build + wrangler dev)
        # sólo corre en PRs. Al hacer merge a `main` ese mismo código ya pasó el
        # e2e en su PR; en `main` se mantiene el resto del gate antes de desplegar.
        if: steps.changes.outputs.code == 'true' && github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright, against a local build)
        # El e2e (lo más caro del gate: navegadores + otro build + wrangler dev)
        # sólo corre en PRs. Al hacer merge a `main` ese mismo código ya pasó el
        # e2e en su PR; en `main` se mantiene el resto del gate antes de desplegar.
        if: steps.changes.outputs.code == 'true' && github.event_name == 'pull_request'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-staging:
    needs: validate
    # Staging ya no se despliega en cada push de cada PR (era un npm ci + build
    # + deploy extra cada vez). Sólo si la PR lleva la etiqueta `staging`
    # (añádela y haz un push, o usa el workflow manual "Poblar y desplegar
    # staging"). Nunca en cambios que sólo tocan documentación.
    if: >-
      github.event_name == 'pull_request'
      && needs.validate.outputs.code == 'true'
      && contains(github.event.pull_request.labels.*.name, 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Preflight (antes era un job aparte, con su propio runner y su propio
      # npm ci): comprueba secretos, variables y acceso a Cloudflare ANTES de
      # cualquier escritura (backup, migraciones, deploy). Mismo efecto, menos minutos.

      - name: Verify required secrets are present (never prints their values)
        run: |
          missing=()
          [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && missing+=(CLOUDFLARE_API_TOKEN)
          [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secret(s) in the 'staging' GitHub Environment: ${missing[*]}. Add them under Settings > Environments > staging > Secrets."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify STAGING_URL is set and well-formed
        run: |
          url="${{ vars.STAGING_URL }}"
          if [ -z "$url" ]; then
            echo "::error::The 'staging' GitHub Environment variable STAGING_URL is not set — the smoke-test step would silently receive an empty URL after deploy. Set it under Settings > Environments > staging > Variables."
            exit 1
          fi
          if ! [[ "$url" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?(/.*)?$ ]]; then
            echo "::error::STAGING_URL ('$url') does not look like a valid https:// URL."
            exit 1
          fi
          echo "STAGING_URL is set and well-formed."

      - name: Verify Cloudflare account access (wrangler whoami)
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify D1 database access
        run: npx wrangler d1 info sa_inmobiliaria_staging --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify R2 bucket access
        run: |
          if ! npx wrangler r2 bucket list | grep -q "sa-inmobiliaria-media-staging"; then
            echo "::error::R2 bucket 'sa-inmobiliaria-media-staging' was not found in this Cloudflare account/token scope."
            exit 1
          fi
          echo "R2 bucket sa-inmobiliaria-media-staging is reachable."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: npm run build

      - name: List pending staging migrations (visibility only — apply step below is authoritative)
        run: npx wrangler d1 migrations list sa_inmobiliaria_staging --remote --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply pending migrations (staging D1)
        run: npx wrangler d1 migrations apply sa_inmobiliaria_staging --remote --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker (staging)
        # Only reached if the migration step above succeeded — a failed
        # migration stops the job here, so staging never runs new code
        # against an old/partially-migrated schema.
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke tests (staging)
        # `npm run build` de este mismo job corrió con GITHUB_SHA en el
        # entorno, así que el bundle desplegado lleva ese commit dentro
        # (scripts/build-info.mjs) y el smoke test lo comprueba contra el
        # GITHUB_SHA que él mismo ve: si lo que está sirviendo no es lo que
        # este job acaba de publicar, falla aquí en vez de pasar en verde.
        run: npm run smoke-test -- "${{ vars.STAGING_URL }}"

  deploy-production:
    needs: validate
    # Un merge que sólo toca documentación no despliega (no cambia el Worker).
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push'
      && needs.validate.outputs.code == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Preflight (antes era un job aparte, con su propio runner y su propio
      # npm ci): comprueba secretos, variables y acceso a Cloudflare ANTES de
      # cualquier escritura (backup, migraciones, deploy). Mismo efecto, menos minutos.

      - name: Verify required secrets are present (never prints their values)
        run: |
          missing=()
          [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && missing+=(CLOUDFLARE_API_TOKEN)
          [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secret(s) in the 'production' GitHub Environment: ${missing[*]}. Add them under Settings > Environments > production > Secrets."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify PRODUCTION_URL is set and well-formed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          url="${{ vars.PRODUCTION_URL }}"
          if [ -z "$url" ]; then
            # Decir "falta X" sin decir qué poner deja a alguien buscando su
            # propia URL, que no está en ninguna parte del repositorio. Con el
            # token ya verificado en el paso anterior se puede preguntar a
            # Cloudflare y ofrecer el valor listo para pegar.
            suggestion="$(node scripts/worker-url.mjs || true)"
            if [ -n "$suggestion" ]; then
              echo "::error::The 'production' GitHub Environment variable PRODUCTION_URL is not set. Set it to '$suggestion' under Settings > Environments > production > Variables (use your own domain instead if the site is served from one)."
            else
              echo "::error::The 'production' GitHub Environment variable PRODUCTION_URL is not set — the smoke-test step would silently receive an empty URL after deploy. Set it under Settings > Environments > production > Variables."
            fi
            exit 1
          fi
          if ! [[ "$url" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?(/.*)?$ ]]; then
            echo "::error::PRODUCTION_URL ('$url') does not look like a valid https:// URL."
            exit 1
          fi
          echo "PRODUCTION_URL is set and well-formed."

      - name: Verify Cloudflare account access (wrangler whoami)
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify D1 database access
        run: npx wrangler d1 info sa_inmobiliaria --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify R2 bucket access
        run: |
          if ! npx wrangler r2 bucket list | grep -q "sa-inmobiliaria-media"; then
            echo "::error::R2 bucket 'sa-inmobiliaria-media' was not found in this Cloudflare account/token scope."
            exit 1
          fi
          echo "R2 bucket sa-inmobiliaria-media is reachable."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: npm run build

      - name: Backup D1 before migrating (wrangler export, kept as a workflow artifact)
        # Independent of the existing daily cron backup
        # (server/tasks/system/backup-d1.ts, JSON snapshots in R2) — this is
        # a second, immediately-before-this-exact-deploy backup, in D1's own
        # native SQL export format, so a rollback (docs/deployment.md) always
        # has a restore point from the moment right before the migration
        # that's about to run.
        run: npx wrangler d1 export sa_inmobiliaria --remote --output=pre-deploy-backup.sql --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload pre-deploy D1 backup
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-backup-${{ github.sha }}
          path: pre-deploy-backup.sql
          retention-days: 30

      - name: List pending production migrations (visibility only — apply step below is authoritative)
        run: npx wrangler d1 migrations list sa_inmobiliaria --remote --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply pending migrations (production D1)
        run: npx wrangler d1 migrations apply sa_inmobiliaria --remote --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker (production)
        # Only reached if the migration step above succeeded — see the
        # staging job's equivalent step for why that ordering matters.
        run: npx wrangler deploy --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke tests (production)
        # Igual que en staging: además de que la instalación responda,
        # comprueba que el build vivo es el de este job. Mientras Workers
        # Builds siga activo puede no serlo — y entonces este paso se pone
        # en rojo, que es precisamente lo que hoy no se ve.
        run: npm run smoke-test -- "${{ vars.PRODUCTION_URL }}"
