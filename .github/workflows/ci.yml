name: CI & Deploy

# Single pipeline for both validation and deployment — kept as one workflow
# (not a separate deploy.yml) so a PR's build/test/typecheck never runs
# twice. `validate` always runs; `staging-preflight`/`deploy-staging` only
# for pull_request events (never production data/credentials);
# `production-preflight`/`deploy-production` only for a push to `main`.
# No step in this file uses continue-on-error: a failure anywhere stops the
# pipeline before anything downstream (migrations, deploy, smoke tests)
# runs — see docs/deployment.md for the full rollback/runbook this
# pipeline is designed around.
#
# Pipeline shape:
#   validate -> {staging,production}-preflight -> backup -> migrations ->
#   deploy -> smoke test
# The preflight jobs exist so a missing/malformed GitHub Environment
# secret or variable is caught with a clear message before any write
# against Cloudflare (backup, migration, deploy) runs — see
# docs/production-hardening-audit.md (P1-11) for why this was added.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (clean)
        run: npm ci

      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate migrations (sequence + clean apply on a fresh local D1)
        run: npm run migrations:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright, against a local build)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Catches a broken/missing GitHub Environment (secret or var) BEFORE any
  # write against Cloudflare happens — previously the first symptom of a
  # missing/malformed secret was a raw wrangler error mid-pipeline, after
  # the backup step had already run. Nothing here writes anything; every
  # check either confirms presence (never prints the value) or does a
  # read-only call.
  staging-preflight:
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verify required secrets are present (never prints their values)
        run: |
          missing=()
          [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && missing+=(CLOUDFLARE_API_TOKEN)
          [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secret(s) in the 'staging' GitHub Environment: ${missing[*]}. Add them under Settings > Environments > staging > Secrets."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify STAGING_URL is set and well-formed
        run: |
          url="${{ vars.STAGING_URL }}"
          if [ -z "$url" ]; then
            echo "::error::The 'staging' GitHub Environment variable STAGING_URL is not set — the smoke-test step would silently receive an empty URL after deploy. Set it under Settings > Environments > staging > Variables."
            exit 1
          fi
          if ! [[ "$url" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?(/.*)?$ ]]; then
            echo "::error::STAGING_URL ('$url') does not look like a valid https:// URL."
            exit 1
          fi
          echo "STAGING_URL is set and well-formed."

      - name: Verify Cloudflare account access (wrangler whoami)
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify D1 database access
        run: npx wrangler d1 info sa_inmobiliaria_staging --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify R2 bucket access
        run: |
          if ! npx wrangler r2 bucket list | grep -q "sa-inmobiliaria-media-staging"; then
            echo "::error::R2 bucket 'sa-inmobiliaria-media-staging' was not found in this Cloudflare account/token scope."
            exit 1
          fi
          echo "R2 bucket sa-inmobiliaria-media-staging is reachable."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-staging:
    needs: [validate, staging-preflight]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: List pending staging migrations (visibility only — apply step below is authoritative)
        run: npx wrangler d1 migrations list sa_inmobiliaria_staging --remote --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply pending migrations (staging D1)
        run: npx wrangler d1 migrations apply sa_inmobiliaria_staging --remote --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker (staging)
        # Only reached if the migration step above succeeded — a failed
        # migration stops the job here, so staging never runs new code
        # against an old/partially-migrated schema.
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke tests (staging)
        run: npm run smoke-test -- "${{ vars.STAGING_URL }}"

  production-preflight:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verify required secrets are present (never prints their values)
        run: |
          missing=()
          [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && missing+=(CLOUDFLARE_API_TOKEN)
          [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secret(s) in the 'production' GitHub Environment: ${missing[*]}. Add them under Settings > Environments > production > Secrets."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify PRODUCTION_URL is set and well-formed
        run: |
          url="${{ vars.PRODUCTION_URL }}"
          if [ -z "$url" ]; then
            echo "::error::The 'production' GitHub Environment variable PRODUCTION_URL is not set — the smoke-test step would silently receive an empty URL after deploy. Set it under Settings > Environments > production > Variables."
            exit 1
          fi
          if ! [[ "$url" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?(/.*)?$ ]]; then
            echo "::error::PRODUCTION_URL ('$url') does not look like a valid https:// URL."
            exit 1
          fi
          echo "PRODUCTION_URL is set and well-formed."

      - name: Verify Cloudflare account access (wrangler whoami)
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify D1 database access
        run: npx wrangler d1 info sa_inmobiliaria --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify R2 bucket access
        run: |
          if ! npx wrangler r2 bucket list | grep -q "sa-inmobiliaria-media"; then
            echo "::error::R2 bucket 'sa-inmobiliaria-media' was not found in this Cloudflare account/token scope."
            exit 1
          fi
          echo "R2 bucket sa-inmobiliaria-media is reachable."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    needs: [validate, production-preflight]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Backup D1 before migrating (wrangler export, kept as a workflow artifact)
        # Independent of the existing daily cron backup
        # (server/tasks/system/backup-d1.ts, JSON snapshots in R2) — this is
        # a second, immediately-before-this-exact-deploy backup, in D1's own
        # native SQL export format, so a rollback (docs/deployment.md) always
        # has a restore point from the moment right before the migration
        # that's about to run.
        run: npx wrangler d1 export sa_inmobiliaria --remote --output=pre-deploy-backup.sql --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload pre-deploy D1 backup
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-backup-${{ github.sha }}
          path: pre-deploy-backup.sql
          retention-days: 30

      - name: List pending production migrations (visibility only — apply step below is authoritative)
        run: npx wrangler d1 migrations list sa_inmobiliaria --remote --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply pending migrations (production D1)
        run: npx wrangler d1 migrations apply sa_inmobiliaria --remote --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker (production)
        # Only reached if the migration step above succeeded — see the
        # staging job's equivalent step for why that ordering matters.
        run: npx wrangler deploy --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke tests (production)
        run: npm run smoke-test -- "${{ vars.PRODUCTION_URL }}"
