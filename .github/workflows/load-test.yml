name: Load test (k6)

# Manual only — this never runs on push/PR. A load test generates real
# traffic against a real deployed environment; it must be a deliberate
# action, never a side effect of a commit. See scripts/load-test/k6-load-test.js
# for what it actually exercises (read-only public browsing routes only —
# no booking/lead-capture writes).
#
# BLOCKED today: the 'environment' input below resolves to the 'staging' or
# 'production' GitHub Environment, whose STAGING_URL/PRODUCTION_URL
# variables are not configured yet (docs/production-hardening-audit.md,
# "Requiere configuración manual externa") — this workflow is ready to use
# the moment those exist; the preflight step below fails with a clear
# message until then, same pattern as staging-preflight/production-preflight
# in ci.yml.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to load-test'
        required: true
        type: choice
        options: [staging, production]
        default: staging

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      base_url: ${{ steps.resolve.outputs.base_url }}
    steps:
      # Todo lo que viene de fuera del script (la entrada y las variables del
      # Environment) viaja por el entorno, nunca interpolado en el `run:`:
      # ${{ }} se sustituye antes de que bash lea la línea, de modo que su
      # contenido se ejecutaría como orden del shell.
      # Quién puede disparar esto. Un test de carga apuntado a producción es
      # una denegación de servicio con otro nombre, así que vale la misma
      # regla que en el resto de workflows manuales: sólo quien esté en la
      # lista. Para autorizar a alguien más, añádelo separado por comas.
      - name: Comprobar quién dispara
        env:
          AUTORIZADOS: 'serendipiaagency'
          ACTOR: ${{ github.actor }}
        run: |
          case ",$AUTORIZADOS," in
            *",$ACTOR,"*) echo "Disparado por $ACTOR (autorizado)." ;;
            *)
              echo "::error::$ACTOR no está autorizado a disparar este workflow. No se ha tocado nada."
              exit 1
              ;;
          esac

      - name: Resolve and verify the target URL
        id: resolve
        env:
          ENTORNO: ${{ inputs.environment }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ "$ENTORNO" = "production" ]; then
            url="$PRODUCTION_URL"
            var_name="PRODUCTION_URL"
          else
            url="$STAGING_URL"
            var_name="STAGING_URL"
          fi
          if [ -z "$url" ]; then
            echo "::error::The '$ENTORNO' GitHub Environment variable $var_name is not set — nothing to load-test against. Set it under Settings > Environments > $ENTORNO > Variables."
            exit 1
          fi
          echo "base_url=$url" >> "$GITHUB_OUTPUT"
          echo "Load-testing $url"

  load-test:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run k6
        uses: grafana/k6-action@v0.3.1
        with:
          filename: scripts/load-test/k6-load-test.js
        env:
          BASE_URL: ${{ needs.preflight.outputs.base_url }}
