name: Sembrar catálogo de demostración

# ESCRIBE EN PRODUCCIÓN. Sólo se dispara a mano.
#
# Mete en el catálogo de UNA organización un conjunto de propiedades de
# demostración con la ficha completa: ubicación con coordenadas, precio con
# plan de pagos, características, galería, planos, tipos de unidad, redes
# sociales y comercial asignado.
#
# Por qué es manual y por qué pide la organización a mano: estas propiedades
# aparecen en el panel de esa agencia y también en su web pública — el feed de
# la portada (`/api/public/home`) no filtra por publicada. Sembrar en la
# organización equivocada le pone anuncios inventados a una inmobiliaria real.
# Ese es exactamente el tipo de decisión que no se toma por defecto.
#
# Es reversible: `accion: limpiar` borra lo sembrado y no toca nada más. Todo
# lo que crea el script lleva el prefijo `demo-` en el slug y sólo borra lo
# que lleve ese prefijo.
on:
  workflow_dispatch:
    inputs:
      organizacion:
        description: 'ID de la organización (agencia) donde sembrar. Míralo en Sistema → Empresas.'
        required: true
        type: string
      accion:
        description: 'Qué hacer'
        required: true
        default: sembrar
        type: choice
        options:
          - sembrar
          - limpiar
      confirmar:
        description: 'Escribe APLICAR para confirmar que se va a escribir en la base de datos de producción'
        required: true
        type: string

jobs:
  seed:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      # Las entradas viajan por el entorno, nunca interpoladas en el script:
      # ${{ }} se sustituye antes de que bash lea la línea, así que un valor
      # con comillas y `;` se ejecutaría como orden del shell en un job que
      # lleva dentro el CLOUDFLARE_API_TOKEN de producción. Es además lo que
      # hace que las comprobaciones de abajo sirvan: un valor capaz de romper
      # el script puede saltárselas.
      # Quién puede disparar esto. No basta con que el workflow sea manual:
      # cualquiera con acceso de escritura al repositorio puede lanzarlo, y
      # estos jobs llevan dentro los secretos de producción. Si alguien deja
      # el proyecto y su acceso a GitHub tarda en revocarse, esta línea es lo
      # que separa «ya no trabaja aquí» de «sigue entrando en producción».
      #
      # Para autorizar a alguien más, añádelo a la lista separada por comas.
      - name: Comprobar quién dispara
        env:
          AUTORIZADOS: 'serendipiaagency'
          ACTOR: ${{ github.actor }}
        run: |
          case ",$AUTORIZADOS," in
            *",$ACTOR,"*) echo "Disparado por $ACTOR (autorizado)." ;;
            *)
              echo "::error::$ACTOR no está autorizado a disparar este workflow. No se ha tocado nada."
              exit 1
              ;;
          esac

      - name: Comprobar la confirmación
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
          ORGANIZACION: ${{ inputs.organizacion }}
        run: |
          if [ "$CONFIRMAR" != "APLICAR" ]; then
            echo "::error::Confirmación ausente o incorrecta. No se ha tocado nada."
            exit 1
          fi
          case "$ORGANIZACION" in
            ''|*[!0-9]*)
              echo "::error::La organización debe ser un número. No se ha tocado nada."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Qué hay ahora en ese catálogo
        run: |
          npx wrangler d1 execute sa_inmobiliaria --remote --env="" --command \
            "SELECT
               (SELECT count(*) FROM developer_properties WHERE organization_id = $ORGANIZACION) AS obra_nueva_total,
               (SELECT count(*) FROM developer_properties WHERE organization_id = $ORGANIZACION AND slug LIKE 'demo-%') AS obra_nueva_demo,
               (SELECT count(*) FROM agent_properties WHERE organization_id = $ORGANIZACION) AS segunda_mano_total,
               (SELECT count(*) FROM agent_properties WHERE organization_id = $ORGANIZACION AND slug LIKE 'demo-%') AS segunda_mano_demo"
        env:
          ORGANIZACION: ${{ inputs.organizacion }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Copia de seguridad de D1 antes de escribir
        run: npx wrangler d1 export sa_inmobiliaria --remote --output=pre-seed-backup.sql --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # NUNCA como artefacto: este repositorio es público y sus artefactos se
      # descargan sin autenticación, así que subir el volcado era publicar la
      # base de datos de producción entera. Va al bucket de R2, que es privado.
      - name: Guardar la copia en R2 (privado)
        run: |
          npx wrangler r2 object put \
            "sa-inmobiliaria-media/backups/pre-seed/${{ github.run_id }}.sql" \
            --file=pre-seed-backup.sql --content-type="application/sql" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: No dejar el volcado en el runner
        if: always()
        run: rm -f pre-seed-backup.sql

      - name: Ejecutar
        # Sólo se llega aquí si la copia se subió: el paso anterior falla el
        # job si no.
        run: |
          if [ "$ACCION" = "limpiar" ]; then
            node scripts/seed-demo-properties.mjs --org "$ORGANIZACION" --wipe --remote --confirm APLICAR
          else
            node scripts/seed-demo-properties.mjs --org "$ORGANIZACION" --remote --confirm APLICAR
          fi
        env:
          ACCION: ${{ inputs.accion }}
          ORGANIZACION: ${{ inputs.organizacion }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
