name: D1 — marcar una migración como ya aplicada (sin ejecutar su SQL)

# Uso excepcional. Existe para un caso concreto: el esquema que una migración
# crearía ya existe en producción por otro camino (una migración anterior,
# nunca comiteada a git, aplicada a mano en algún momento) y wrangler la
# tiene marcada como pendiente para siempre, reintentándola —y fallando— en
# cada despliegue. Este workflow inserta una sola fila en la tabla de
# control `d1_migrations` con el nombre del fichero, SIN ejecutar ni una
# línea de su SQL. Nunca toca ninguna tabla de negocio.
#
# Sólo se dispara a mano, con confirmación explícita cada vez — mismo
# patrón que apply-migrations.yml.
on:
  workflow_dispatch:
    inputs:
      migration_filename:
        description: 'Nombre EXACTO del fichero en migrations/ a marcar como aplicado'
        required: true
      confirmar:
        description: 'Escribe CONFIRMO para confirmar que el esquema de esa migración ya existe de verdad en producción por otro camino'
        required: true
        type: string

jobs:
  mark-applied:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      # Las entradas viajan por el entorno, nunca interpoladas en el script:
      # ${{ }} se sustituye antes de que bash lea la línea, así que un valor
      # con comillas y `;` se ejecutaría como orden del shell en un job que
      # lleva dentro el CLOUDFLARE_API_TOKEN de producción. Esto también es
      # lo que hace que las comprobaciones de abajo sirvan de algo: si el
      # valor puede romper el script, puede saltárselas.
      # Quién puede disparar esto. No basta con que el workflow sea manual:
      # cualquiera con acceso de escritura al repositorio puede lanzarlo, y
      # estos jobs llevan dentro los secretos de producción. Si alguien deja
      # el proyecto y su acceso a GitHub tarda en revocarse, esta línea es lo
      # que separa «ya no trabaja aquí» de «sigue entrando en producción».
      #
      # Para autorizar a alguien más, añádelo a la lista separada por comas.
      - name: Comprobar quién dispara
        env:
          AUTORIZADOS: 'serendipiaagency'
          ACTOR: ${{ github.actor }}
        run: |
          case ",$AUTORIZADOS," in
            *",$ACTOR,"*) echo "Disparado por $ACTOR (autorizado)." ;;
            *)
              echo "::error::$ACTOR no está autorizado a disparar este workflow. No se ha tocado nada."
              exit 1
              ;;
          esac

      - name: Comprobar la confirmación
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          if [ "$CONFIRMAR" != "CONFIRMO" ]; then
            echo "::error::Confirmación ausente o incorrecta. No se ha tocado nada."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Comprobar que el fichero existe en este repositorio (evita errores de tecleo)
        env:
          MIGRATION_FILENAME: ${{ inputs.migration_filename }}
        run: |
          f="migrations/$MIGRATION_FILENAME"
          if [ ! -f "$f" ]; then
            echo "::error::No existe $f en este repositorio. Revisa el nombre exacto (tal cual aparece en migrations/)."
            exit 1
          fi

      - name: Comprobar que no está ya marcada como aplicada
        run: |
          npx wrangler d1 execute sa_inmobiliaria --remote --command "SELECT * FROM d1_migrations WHERE name = '$MIGRATION_FILENAME';"
        env:
          MIGRATION_FILENAME: ${{ inputs.migration_filename }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Marcar como aplicada (una fila en d1_migrations, ninguna tabla de negocio)
        run: |
          npx wrangler d1 execute sa_inmobiliaria --remote --command "INSERT INTO d1_migrations (name, applied_at) VALUES ('$MIGRATION_FILENAME', datetime('now'));"
        env:
          MIGRATION_FILENAME: ${{ inputs.migration_filename }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Confirmar el resultado
        run: |
          npx wrangler d1 execute sa_inmobiliaria --remote --command "SELECT * FROM d1_migrations WHERE name = '$MIGRATION_FILENAME';"
        env:
          MIGRATION_FILENAME: ${{ inputs.migration_filename }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
