name: Enlace de acceso al panel

# Recuperar el acceso al panel cuando nadie puede entrar y el envío de emails
# no está conectado, de modo que el flujo normal de "he olvidado mi
# contraseña" no sirve porque nadie recibe nada.
#
# Sólo se dispara a mano. No forma parte de ningún despliegue y no corre en
# ningún push.
#
# Lo que hace: acuña una fila en `password_reset_tokens` —la misma que
# escribiría la aplicación— y imprime el enlace `/reset-password/<token>`.
# Quien lo abre elige su propia contraseña. Este workflow **nunca ve una
# contraseña**: ni la recibe, ni la genera, ni la imprime.
#
# Lo que hay que saber: el enlace acaba en el registro de esta ejecución,
# visible para quien tenga acceso de lectura al repositorio. Por eso caduca
# en 15 minutos por defecto y sólo sirve una vez. Es una decisión consciente,
# no un descuido.
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Correo de la cuenta que recupera el acceso'
        required: true
        type: string
      base_url:
        description: 'URL pública con https://. Si se deja vacía se averigua el subdominio workers.dev de la cuenta.'
        required: false
        default: ''
        type: string
      ttl_minutes:
        description: 'Minutos de validez del enlace (1-60)'
        required: false
        default: '15'
        type: string

jobs:
  admin-access-link:
    runs-on: ubuntu-latest
    # Igual que en los jobs de preflight y deploy: sin esta línea no se
    # resuelven los secretos del Environment y wrangler no podría autenticarse.
    environment:
      name: production
    steps:
      # Quién puede disparar esto. No basta con que el workflow sea manual:
      # cualquiera con acceso de escritura al repositorio puede lanzarlo, y
      # estos jobs llevan dentro los secretos de producción. Si alguien deja
      # el proyecto y su acceso a GitHub tarda en revocarse, esta línea es lo
      # que separa «ya no trabaja aquí» de «sigue entrando en producción».
      #
      # Para autorizar a alguien más, añádelo a la lista separada por comas.
      - name: Comprobar quién dispara
        env:
          AUTORIZADOS: 'serendipiaagency'
          ACTOR: ${{ github.actor }}
        run: |
          case ",$AUTORIZADOS," in
            *",$ACTOR,"*) echo "Disparado por $ACTOR (autorizado)." ;;
            *)
              echo "::error::$ACTOR no está autorizado a disparar este workflow. No se ha tocado nada."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Las entradas viajan por el entorno, nunca interpoladas en el script:
      # ${{ }} se sustituye antes de que bash lea la línea, así que un valor
      # con comillas y `;` se ejecutaría como orden del shell en un job que
      # lleva dentro el CLOUDFLARE_API_TOKEN de producción.
      - name: Acuñar el enlace de un solo uso
        run: node scripts/mint-access-link.mjs "$EMAIL" "$BASE_URL" "$TTL_MINUTES"
        env:
          EMAIL: ${{ inputs.email }}
          BASE_URL: ${{ inputs.base_url }}
          TTL_MINUTES: ${{ inputs.ttl_minutes }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
