name: Diagnóstico de acceso al panel

# Sólo lectura. Responde "¿por qué no me deja entrar?" con hechos de la base
# de datos real, en vez de a base de conjeturas: si la cuenta existe, su rol,
# si su columna `permissions` la está dejando sin áreas (el efecto silencioso
# de que el código del bloque 01 esté vivo sin la migración 0061), si el
# último enlace de acceso se llegó a usar, y si hay bloqueos de login activos.
#
# No escribe nada, no imprime contraseñas ni hashes, y del limitador sólo
# saca recuentos — nunca la IP de nadie.
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Correo de la cuenta a diagnosticar'
        required: true
        type: string

jobs:
  admin-access-diagnose:
    runs-on: ubuntu-latest
    # Necesario para que se resuelvan los secretos del Environment — ver la
    # nota en los jobs de preflight de ci.yml.
    environment:
      name: production
    steps:
      # Quién puede disparar esto. No basta con que el workflow sea manual:
      # cualquiera con acceso de escritura al repositorio puede lanzarlo, y
      # estos jobs llevan dentro los secretos de producción. Si alguien deja
      # el proyecto y su acceso a GitHub tarda en revocarse, esta línea es lo
      # que separa «ya no trabaja aquí» de «sigue entrando en producción».
      #
      # Para autorizar a alguien más, añádelo a la lista separada por comas.
      - name: Comprobar quién dispara
        env:
          AUTORIZADOS: 'serendipiaagency'
          ACTOR: ${{ github.actor }}
        run: |
          case ",$AUTORIZADOS," in
            *",$ACTOR,"*) echo "Disparado por $ACTOR (autorizado)." ;;
            *)
              echo "::error::$ACTOR no está autorizado a disparar este workflow. No se ha tocado nada."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Las entradas viajan por el entorno, nunca interpoladas en el script:
      # ${{ }} se sustituye antes de que bash lea la línea, así que un valor
      # con comillas y `;` se ejecutaría como orden del shell en un job que
      # lleva dentro el CLOUDFLARE_API_TOKEN de producción.
      - name: Diagnosticar
        run: node scripts/diagnose-access.mjs "$EMAIL"
        env:
          EMAIL: ${{ inputs.email }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
